name: Ouro Medicines
description: 'Ouro Medicines is a clinical-stage biotechnology company based in South
  San Francisco, California, defining the future of treatment for people with immune-mediated
  diseases. Its pipeline centers on T cell engager programs for autoimmune conditions,
  including the lead candidate OM336 (evaluated in the AIC-1001 clinical trial), alongside
  an expanded access policy. The company was surfaced as a portfolio company of Norwest
  Venture Partners and added to the API Evangelist network as a lead. As a therapeutics
  developer, Ouro Medicines publishes a corporate and scientific website but no public
  developer program, API, or technical documentation surface. Recent company news
  includes a definitive agreement for Gilead Sciences to acquire Ouro Medicines to
  advance its first-in-class T cell engager program for autoimmune diseases.'
